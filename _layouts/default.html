<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1116">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F2">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <title>{{ page.title | default: site.title | escape }}</title>
    <script>
      const requestedTheme = new URLSearchParams(location.search).get("theme");
      document.documentElement.dataset.theme = ["dark", "light"].includes(requestedTheme)
        ? requestedTheme
        : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    </script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the work</a>
    {{ content }}
  </body>
</html>
